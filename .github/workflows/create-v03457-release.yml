name: Create HRA v0.34.57 Public Download Release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/create-v03457-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create v0.34.57 public download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.34.57 >/dev/null 2>&1; then
            echo 'v0.34.57 release already exists.'
          else
            gh release create v0.34.57 \
              --title 'Hungate Racing Assistant v0.34.57' \
              --notes 'Protected public binary distribution release for Hungate Racing Assistant. Source code remains private. This release is downloadable manually; the automatic updater channel remains on v0.34.55 until separately promoted.'
          fi
