name: Publish HRA v0.34.59 Public Download

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v03459-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated v0.34.59 artifact
        run: |
          curl -L --fail --silent --show-error 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-abec-8210-94e0-a11001012e1b/raw?se=2026-10-10T19%3A36%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=6bbfbbb2-af13-5998-806c-6da8cd2ef357&skoid=e5e3659d-4463-4dbf-b2ce-ee32bc0a0a8d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T07%3A31%3A22Z&ske=2026-10-11T07%3A31%3A22Z&sks=b&skv=2026-02-06&sig=xG4K54AbToZwNNL48RTaE9aDIQwibVYvqmNOIwyg1iA%3D' -o /tmp/hra-v03459.zip
          echo "11891d5da8c3e20d979559909567df8a53896ddb7fb9d93d96597993e6b49fb4  /tmp/hra-v03459.zip" | sha256sum -c -
          mkdir -p /tmp/hra-v03459
          unzip -q /tmp/hra-v03459.zip -d /tmp/hra-v03459
          echo "adb466b90a12268fcab815c062c8f9e15c332b230dda131d1b74744a87f5653c  /tmp/hra-v03459/Hungate_Racing_Assistant_v0.34.59_Setup.exe" | sha256sum -c -

      - name: Create or update v0.34.59 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.34.59 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create v0.34.59               --repo "${{ github.repository }}"               --title 'Hungate Racing Assistant v0.34.59'               --notes 'Discord access UX release. Protected public binary distribution; source code remains private. Manual download release only; automatic updater channel remains on v0.34.55 until separately promoted.'
          fi
          gh release upload v0.34.59             /tmp/hra-v03459/Hungate_Racing_Assistant_v0.34.59_Setup.exe             --repo "${{ github.repository }}"             --clobber
          gh release edit v0.34.59 --repo "${{ github.repository }}" --latest
